name: CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - 'unocss-mini-extra-rules-v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Зеркальность docs/en ↔ docs/ru (структура заголовков, блоки кода,
  # ссылки, объём) и корневых README.md ↔ README.ru.md. Скрипт использует
  # только встроенные модули Node, поэтому установка зависимостей не нужна.
  docs-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check en/ru documentation parity
        run: node scripts/check-docs-parity.mjs

  # Тесты универсального пресета @feugene/unocss-preset-granular.
  test-unocss-preset-granular:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # `src/preset.ts` импортирует `@feugene/unocss-mini-extra-rules`, а тот
      # экспортируется только из `dist`, которого в чистом чекауте нет
      # (`/dist` в `.gitignore`). Без этого шага падают и typecheck
      # (TS2307), и тесты (16 файлов из 25) — локально они зелёные лишь
      # потому, что `dist` уже лежит от прошлой сборки.
      - name: Build preset dependency (@feugene/unocss-mini-extra-rules)
        run: yarn build:unocss-mini-extra-rules

      # Линт и typecheck от версии Node не зависят — гоняем один раз, на
      # старшей из матрицы, а не по разу на каждую.
      #
      # `lint:check`, а не `lint`: последний идёт с `--fix` — в CI он молча
      # починил бы нарушения и вышел с нулём.
      - name: Lint package
        if: matrix.node == 24
        run: yarn workspace @feugene/unocss-preset-granular lint:check

      # Шире, чем `tsc` внутри `build`: тот собирает d.ts по
      # `tsconfig.build.json`, где тесты исключены. Здесь — `tsconfig.json`,
      # то есть вместе с `src/**/__tests__` и конфигами Vite/Vitest.
      - name: Typecheck package
        if: matrix.node == 24
        run: yarn workspace @feugene/unocss-preset-granular typecheck

      - name: Test package
        run: yarn test:granular

      # Чистые функции измерителя бюджета CSS/JS. `dist` им не нужен, поэтому
      # шаг стоит здесь, а не в `verify-contract`: измеритель, который врёт,
      # хуже отсутствия измерителя, и падать он должен раньше сборки.
      - name: Test repository scripts
        if: matrix.node == 24
        run: yarn test:scripts

  # Сборка @feugene/unocss-preset-granular. Артефакт используется
  # для валидации (publint) и публикации по тегу `v*`.
  build-unocss-preset-granular:
    needs:
      - test-unocss-preset-granular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Порядок обязателен: правила из `@feugene/unocss-mini-extra-rules`
      # попадают в бандл пресета, а `tsc` берёт оттуда типы для d.ts.
      # Тот же порядок зафиксирован в корневом `build:packages`.
      - name: Build preset dependency (@feugene/unocss-mini-extra-rules)
        run: yarn build:unocss-mini-extra-rules

      - name: Build package
        run: yarn build:granular

      - name: Validate package metadata (publint)
        working-directory: packages/unocss-preset-granular
        run: npx --yes publint@latest --pack npm

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: unocss-preset-granular-dist
          path: packages/unocss-preset-granular/dist/

  # Сквозная проверка контракта: сборка пресета → доп-правил → провайдеров →
  # приложений, затем сверка собранного CSS с `expected-css.mjs` каждого
  # приложения.
  #
  # Юнит-тесты пресета этого не заменяют: успешная сборка сама по себе ничего
  # не доказывает — она остаётся зелёной и тогда, когда классы компонента молча
  # пропали из CSS (не та scan-директория, не доехавший в `dist` CSS темы,
  # разъехавшийся `packageBaseUrl`). Ровно это и ловит `verify:apps`.
  #
  # Порядок сборки — часть контракта: провайдеры на своей сборке импортируют
  # `@feugene/unocss-preset-granular/{vite,contract}` из `dist`. Поэтому здесь
  # `build:all` целиком, а не переиспользование артефакта: сборка приложения
  # поверх устаревшего `dist` пресета проходит успешно и даёт неверный CSS.
  verify-contract:
    needs:
      - test-unocss-preset-granular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build packages and apps
        run: yarn build:all

      - name: Verify built CSS against app expectations
        run: yarn verify:apps

      # Бюджет стендов замера. Порога на байты здесь нет намеренно — gzip
      # невоспроизводим между средами. Гейтятся только булевы факты: запись
      # `safelist` не дала CSS, токен потребляется без fallback и нигде не
      # объявлен, ассет не опознан классификатором.
      - name: Verify CSS/JS budget of the benchmark stands
        run: yarn sizes:check

  # Публикация @feugene/unocss-preset-granular в npm по тегу `v<semver>`.
  #
  # Зависит и от `verify-contract`: пресет, который ломает провайдеров или
  # приложения, публиковать нельзя, даже если его собственные тесты зелёные.
  publish-npm-unocss-preset-granular:
    needs:
      - build-unocss-preset-granular
      - verify-contract
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        working-directory: packages/unocss-preset-granular
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: unocss-preset-granular-dist
          path: packages/unocss-preset-granular/dist

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/unocss-preset-granular
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Зеркало в GitHub Packages под scope владельца репозитория
  # (`@efureev/unocss-preset-granular`).
  publish-gpr-unocss-preset-granular:
    needs:
      - publish-npm-unocss-preset-granular
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@efureev'

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: unocss-preset-granular-dist
          path: packages/unocss-preset-granular/dist

      - name: Prepare package for GitHub Packages
        working-directory: packages/unocss-preset-granular
        run: |
          npm pkg set name='@efureev/unocss-preset-granular'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          node -e "const p=require('./package.json');console.log('publishing as:',p.name,'@',p.version)"

      - name: Publish to GitHub Packages
        working-directory: packages/unocss-preset-granular
        run: npm publish --ignore-scripts --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # Юнит-тесты @feugene/unocss-mini-extra-rules — по исходникам (`src/`), без
  # сборки: правила пакета чистые функции без FS/DOM. Гоняются на матрице
  # node, как у granular-пресета.
  test-unocss-mini-extra-rules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test package
        run: yarn workspace @feugene/unocss-mini-extra-rules test:run

      # Тип-тест публичного API (`src/__tests__/publicApi.test-d.ts`) — форма
      # `Rule[]`/`Variant[]`/`Preflight[]` каждого экспорта проверяется через
      # `tsc`, а не только на потребителях (granular-пресет, app-4).
      - name: Test package public API types
        run: yarn workspace @feugene/unocss-mini-extra-rules test:types

  # Сборка @feugene/unocss-mini-extra-rules. Пакет содержит дополнительные
  # правила поверх @unocss/preset-mini (animation, colorOpacity, filters,
  # spacing) и не зависит от рантайма @feugene/granularity.
  build-unocss-mini-extra-rules:
    needs:
      - test-unocss-mini-extra-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck package
        run: yarn workspace @feugene/unocss-mini-extra-rules typecheck

      - name: Build package
        run: yarn build:unocss-mini-extra-rules

      - name: Validate package metadata (publint)
        working-directory: packages/unocss-mini-extra-rules
        run: npx --yes publint@latest --pack npm

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: unocss-mini-extra-rules-dist
          path: packages/unocss-mini-extra-rules/dist/

  # Публикация @feugene/unocss-mini-extra-rules в npm по тегу
  # `unocss-mini-extra-rules-v<semver>`. Независимый префикс тега позволяет
  # релизить пакет отдельно от остальных.
  #
  # Логику правил гейтит `test-unocss-mini-extra-rules` (через транзитивный
  # `needs` у `build-unocss-mini-extra-rules`) — юнит-тесты пакета, не app-4.
  # `verify-contract` в зависимостях остаётся отдельным сигналом: app-4
  # (`includeExtraRules: false`, все правила подключены напрямую из этого
  # пакета) реально потребляет собранный `dist/`, так что он ловит и то, что
  # юнит-тестам не видно — сломанный `exports`/бандл при неизменной логике.
  publish-npm-unocss-mini-extra-rules:
    needs:
      - build-unocss-mini-extra-rules
      - verify-contract
    if: startsWith(github.ref, 'refs/tags/unocss-mini-extra-rules-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package version
        working-directory: packages/unocss-mini-extra-rules
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#unocss-mini-extra-rules-v}"
          echo "package.json version: $PKG_VERSION"
          echo "git tag version:      $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: unocss-mini-extra-rules-dist
          path: packages/unocss-mini-extra-rules/dist

      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/unocss-mini-extra-rules
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Зеркало в GitHub Packages под scope владельца репозитория
  # (`@efureev/unocss-mini-extra-rules`). Аналогично publish-gpr для granularity.
  publish-gpr-unocss-mini-extra-rules:
    needs:
      - publish-npm-unocss-mini-extra-rules
    if: startsWith(github.ref, 'refs/tags/unocss-mini-extra-rules-v')
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@efureev'

      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: unocss-mini-extra-rules-dist
          path: packages/unocss-mini-extra-rules/dist

      - name: Prepare package for GitHub Packages
        working-directory: packages/unocss-mini-extra-rules
        run: |
          npm pkg set name='@efureev/unocss-mini-extra-rules'
          npm pkg delete publishConfig.provenance
          npm pkg set publishConfig.registry='https://npm.pkg.github.com'
          node -e "const p=require('./package.json');console.log('publishing as:',p.name,'@',p.version)"

      - name: Publish to GitHub Packages
        working-directory: packages/unocss-mini-extra-rules
        run: npm publish --ignore-scripts --no-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
